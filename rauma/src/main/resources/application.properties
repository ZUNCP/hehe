spring.application.name=web-ban-rau

# MySQL — CSDL web_ban_rau (script SQL là nguồn chuẩn)
spring.datasource.url=jdbc:mysql://localhost:3306/web_ban_rau?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Không để Hibernate tạo/sửa bảng (giữ trigger, view, CHECK, ENUM)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false

server.port=8080
server.servlet.context-path=

# JWT
app.jwt.secret=VegeshopJwtSecretKey2026WebBanRauSachXanhPhaiDaiHon32KyTu!!
app.jwt.expiration-ms=86400000

# Singleton AppConfig
app.low-stock-threshold=10
app.bank-transfer-info=Vietcombank - STK 0123456789 - CTCP RAU SACH XANH
